<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verdanskio</title><link rel="icon" href="modernwarfare.ico"><link rel="apple-touch-icon" href="modernwarfare-icon.png">
<style>
@font-face{font-family:MW;src:url('intro-regular.ttf')}@font-face{font-family:MW;src:url('intro-bold.ttf');font-weight:700}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090a;color:#dedede;font-family:MW,Arial,sans-serif}#canvas{position:fixed;inset:0;width:100dvw;height:100dvh;display:block;outline:none}#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0008,#000c),url('intro-background.png') center/cover}#intro:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,#000b)}.wrap{position:relative;width:min(1120px,92vw)}.cod{margin:0 0 55px;text-align:center;font-weight:700;font-size:clamp(34px,5.4vw,62px);line-height:.8;letter-spacing:-2px}.cod small{font-size:.31em;vertical-align:middle;letter-spacing:-1px;display:inline-block;line-height:1;width:1.5em}.account{display:grid;grid-template-columns:1fr 1fr;min-height:350px;background:linear-gradient(110deg,#242729ce,#151819b8);border:1px solid #82898d40;box-shadow:0 0 0 4px #1119,0 12px 65px #0009;padding:38px 58px;gap:65px}.form{padding-right:24px}.info{border-left:1px solid #8b8f9370;padding-left:60px}h2{font-size:22px;font-weight:700;margin:0 0 34px;text-transform:uppercase;letter-spacing:.3px}label{display:block;font-size:14px;margin-bottom:8px;text-transform:uppercase}input{display:block;width:100%;background:#52565a50;color:#eee;border:1px solid #c1c4c7;padding:9px 12px;font:18px MW,Arial;border-radius:0;outline:none}input:focus{border-color:#b6e8ff;box-shadow:0 0 0 1px #8dc4df}button{margin:34px auto 0;display:block;width:86%;padding:9px;color:#e0e1e3;border:1px solid #5d6268;background:linear-gradient(#34383d,#202428);font:17px MW,Arial;text-transform:uppercase;cursor:pointer;box-shadow:0 0 0 4px #15171a66}button:hover,button:focus{color:white;border-color:#b6d9ec;background:linear-gradient(#46545e,#293b47)}button:disabled{opacity:.6;cursor:wait}.wordmark{font-size:clamp(32px,4.2vw,64px);font-weight:700;letter-spacing:-2px;margin:45px 0 16px;line-height:1}.sub{font-size:14px;line-height:1.55;color:#a8aeb3;max-width:340px}#status{font-size:13px;line-height:1.4;color:#b4bdc6;margin:22px 0 9px;min-height:18px}progress{appearance:none;width:100%;height:3px;border:0;background:#171d21}progress::-webkit-progress-bar{background:#171d21}progress::-webkit-progress-value{background:#83afc7}progress::-moz-progress-bar{background:#83afc7}#error{color:#e7a59a;font-size:13px;min-height:16px;margin-top:10px}#retry{display:none}.preload{position:absolute;top:8px;left:10px;color:#89939a;font-size:10px;letter-spacing:.6px;text-transform:uppercase}.footer{position:fixed;bottom:12px;left:15px;font-size:11px;color:#899096}.hidden{display:none!important}@media(max-width:900px){.account{grid-template-columns:1fr;padding:28px;gap:0}.info{display:none}.form{padding:0}.cod{margin-bottom:30px}.wrap{max-width:500px}}
</style></head><body><canvas id="canvas" tabindex="0"></canvas><div id="intro"><span class="preload" id="preload-state">PREPARING VERDANSK</span><main class="wrap"><h1 class="cod">VERDANSKIO</h1><div class="account"><form class="form" id="profile-form"><h2>Create a username</h2><label for="username">Username</label><input id="username" name="username" maxlength="24" autocomplete="nickname" spellcheck="false" required aria-describedby="error"><p id="error" role="alert"></p><button id="play" type="submit">Enter Verdansk</button><p id="status" role="status">Preparing game files...</p><progress id="progress" max="1" value="0"></progress><button id="retry" type="button" onclick="location.reload()">Retry</button></form><section class="info"><h2>Play with your username</h2><div class="wordmark">FREE TO PLAY</div><p class="sub">Your local profile.<br>Your username is saved on this device and displayed in game.</p></section></div></main><span class="footer">LOCAL PROFILE</span></div>
<script src="index.js"></script><script>
'use strict';
window.__verdanskAudioContexts=[];
const PreviousContext=window.AudioContext||window.webkitAudioContext;
if(PreviousContext){window.AudioContext=class extends PreviousContext{constructor(...args){super(...args);window.__verdanskAudioContexts.push(this);}};}
function resumeVerdanskAudio(){for(const c of window.__verdanskAudioContexts)if(c.state==='suspended')c.resume().catch(()=>{});}window.addEventListener('pointerdown',resumeVerdanskAudio,true);window.addEventListener('keydown',resumeVerdanskAudio,true);
const config={"args":["--main-pack","index.pck"],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":782886368,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};const canvas=document.getElementById('canvas'),status=document.getElementById('status'),progress=document.getElementById('progress'),play=document.getElementById('play'),username=document.getElementById('username');
try{username.value=localStorage.getItem('verdanskio.username')||'';}catch{}
config.canvas=canvas;config.canvasResizePolicy=2;config.focusCanvas=true;config.onPrint=(...a)=>console.log(...a);config.onPrintError=(...a)=>console.error(...a);config.onExit=code=>{document.getElementById('intro').classList.remove('hidden');status.textContent='Game closed ('+code+').';document.getElementById('retry').style.display='block';};
const engine=new Engine(config);let entered=false,packed=null,preloadError=null;
function fail(e){preloadError=e;status.textContent='Could not load: '+e.message;document.getElementById('retry').style.display='block';console.error(e);}
const preloaded=(async()=>{if(!Engine.isWebGLAvailable(2))throw Error('WebGL 2 is unavailable.');const init=engine.init('index');const response=await fetch('assets.json',{cache:'no-store'});if(!response.ok)throw Error('Asset manifest HTTP '+response.status);const manifest=await response.json();packed=new Uint8Array(manifest.size);let offset=0;
for(const part of manifest.parts){const data=await fetch(part.file+'?v='+part.sha256);if(!data.ok)throw Error('Game data HTTP '+data.status);const reader=data.body.getReader();let received=0;for(;;){const {done,value}=await reader.read();if(done)break;if(received+value.byteLength>part.size)throw Error('Invalid game data size');packed.set(value,offset+received);received+=value.byteLength;const pct=Math.round(100*(offset+received)/manifest.size);progress.value=(offset+received)/manifest.size;status.textContent='Preparing game files... '+pct+'%';document.getElementById('preload-state').textContent='PREPARING VERDANSK '+pct+'%';}if(received!==part.size)throw Error('Incomplete game data');offset+=received;}
if(offset!==manifest.size)throw Error('Invalid manifest size');await init;status.textContent=entered?'Opening game...':'Ready. Enter your username to play.';document.getElementById('preload-state').textContent='VERDANSK READY';console.log('WEB_ASSETS_PRELOADED');})();preloaded.catch(fail);
document.getElementById('profile-form').addEventListener('submit',async event=>{event.preventDefault();const name=username.value.trim().replace(/[\u0000-\u001f\u007f]/g,'').slice(0,24);if(!name){document.getElementById('error').textContent='Choose a username.';username.focus();return;}if(preloadError)return;entered=true;play.disabled=true;username.disabled=true;window.VerdanskProfile={username:name};try{localStorage.setItem('verdanskio.username',name);}catch{}resumeVerdanskAudio();try{await preloaded;status.textContent='Opening game...';engine.copyToFS('index.pck',packed);packed=null;await engine.start();resumeVerdanskAudio();document.getElementById('intro').classList.add('hidden');canvas.focus();console.log('WEB_ENGINE_STARTED profile='+name);}catch(e){fail(e);play.disabled=false;username.disabled=false;}});
function fitCanvas(){canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';}window.addEventListener('resize',fitCanvas);fitCanvas();
</script></body></html>
